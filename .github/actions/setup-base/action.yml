name: Setup Build Base Composite Action
description: Base build actions for Meshtastic Platform IO steps

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get -y update --fix-missing
        sudo apt-get install -y cppcheck libbluetooth-dev libgpiod-dev libyaml-cpp-dev libjsoncpp-dev lsb-release

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        # Not 3.x: meshtastic in requirements.txt declares Requires-Python <3.15, so the day the
        # runners offered 3.15.0 every job using this action died in pip install, before any repo
        # code ran. build_windows_bin.yml pins the same way.
        python-version: "3.14"
        cache: pip
        cache-dependency-path: |
          .github/actions/**
          **.ini

    - name: Upgrade python tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/actions/setup-base/requirements.txt
